name: 发布扩展安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号，例如 v1.0.1'
        required: true
      release_name:
        description: 'Release 标题，可留空'
        required: false
      make_latest:
        description: '是否标记为最新版本'
        type: choice
        options:
          - 'true'
          - 'false'
          - 'legacy'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: 安装桌面端依赖
        run: npm run install:desktop

      - name: 验证桌面端
        run: npm run check:desktop

      - name: 审计桌面端依赖
        run: npm --prefix desktop-app audit --package-lock-only --audit-level=high

      - name: 构建 Windows 桌面安装包
        run: npm run package:desktop

      - name: 上传 Windows 桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: job-application-helper-desktop
          path: |
            release/desktop/*.exe
            release/desktop/*.sha256
          if-no-files-found: error

  build-and-release:
    runs-on: ubuntu-latest
    needs: build-desktop

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验发布输入并锁定构建提交
        id: meta
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name || '' }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name || '' }}
          INPUT_MAKE_LATEST: ${{ inputs.make_latest || 'true' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法版本标签：${TAG_NAME}" >&2
            exit 1
          fi

          TAG_EXISTS="false"
          if git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            git checkout --detach "refs/tags/${TAG_NAME}"
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"

          RELEASE_NAME="${INPUT_RELEASE_NAME//$'\r'/ }"
          RELEASE_NAME="${RELEASE_NAME//$'\n'/ }"
          if [[ -z "${RELEASE_NAME}" ]]; then
            RELEASE_NAME="秋招网申助手 ${TAG_NAME}"
          fi
          if [[ ${#RELEASE_NAME} -gt 120 ]]; then
            echo "Release 标题不能超过 120 个字符" >&2
            exit 1
          fi
          if [[ ! "${INPUT_MAKE_LATEST}" =~ ^(true|false|legacy)$ ]]; then
            echo "make_latest 只能是 true、false 或 legacy" >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "make_latest=${INPUT_MAKE_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Native Mail Companion 依赖
        run: npm run install:native

      - name: 校验版本一致性
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          node -e '
            const fs = require("fs");
            const expected = process.env.RELEASE_TAG.slice(1);
            const extensionFiles = ["package.json", "package-lock.json", "manifest.json"];
            for (const file of extensionFiles) {
              const value = JSON.parse(fs.readFileSync(file, "utf8")).version;
              if (value !== expected) throw new Error(`${file} version ${value} != ${expected}`);
            }
            const desktopPackage = JSON.parse(fs.readFileSync("desktop-app/package.json", "utf8")).version;
            const desktopLock = JSON.parse(fs.readFileSync("desktop-app/package-lock.json", "utf8")).version;
            if (desktopPackage !== desktopLock) throw new Error(`desktop package version ${desktopPackage} != lock ${desktopLock}`);
          '

      - name: 运行静态检查
        run: npm run lint

      - name: 运行测试
        run: npm test

      - name: 验证 Native Mail Companion
        run: npm run check:native

      - name: 依赖安全审计
        run: |
          npm audit --package-lock-only --audit-level=high
          npm --prefix native-mail-companion audit --package-lock-only --audit-level=high

      - name: 构建并打包扩展与 Native 交付物
        run: npm run package:all

      - name: 下载 Windows 桌面安装包
        uses: actions/download-artifact@v4
        with:
          name: job-application-helper-desktop
          path: release/desktop

      - name: 为手动触发创建标签
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.tag_exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${RELEASE_COMMIT}"
          git push origin "${RELEASE_TAG}"

      - name: 创建 GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: |
            release/job-application-helper-extension.zip
            release/job-application-helper-extension.zip.sha256
            release/job-application-helper-native-mail-companion.zip
            release/job-application-helper-native-mail-companion.zip.sha256
            release/desktop/*.exe
            release/desktop/*.sha256
