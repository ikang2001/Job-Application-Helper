<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <rect width="1180" height="620" fill="white"/>
  <text x="590" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" font-family="Noto Sans SC, Microsoft YaHei">招聘会管理 - 业务用例图</text>

  <circle cx="60" cy="282" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="318" x2="85" y2="318" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="38" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="82" y2="370" stroke="#333" stroke-width="2"/>
  <text x="60" y="390" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC, Microsoft YaHei">求职者</text>

  <line x1="78" y1="300" x2="110" y2="300" stroke="#aaa" stroke-width="1.2"/>
  <ellipse cx="200" cy="300" rx="90" ry="32" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="200" y="305" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei">招聘会管理域</text>

  <g stroke="#ccc" stroke-width="1">
    <line x1="290" y1="300" x2="360" y2="100"/>
    <line x1="290" y1="300" x2="360" y2="180"/>
    <line x1="290" y1="300" x2="360" y2="260"/>
    <line x1="290" y1="300" x2="360" y2="340"/>
    <line x1="290" y1="300" x2="360" y2="420"/>
    <line x1="290" y1="300" x2="360" y2="500"/>
    <line x1="560" y1="180" x2="600" y2="180"/>
    <line x1="560" y1="340" x2="600" y2="340"/>
    <line x1="560" y1="500" x2="600" y2="500"/>
  </g>

  <g fill="white" stroke="#4a7fd4" stroke-width="1.5" font-family="Noto Sans SC, Microsoft YaHei" font-size="13" text-anchor="middle">
    <ellipse cx="460" cy="100" rx="100" ry="28"/><text x="460" y="105" fill="#1a4a8a" stroke="none">新增 / 编辑招聘会</text>
    <ellipse cx="460" cy="180" rx="100" ry="28"/><text x="460" y="185" fill="#1a4a8a" stroke="none">管理时间与地点</text>
    <ellipse cx="460" cy="260" rx="100" ry="28"/><text x="460" y="265" fill="#1a4a8a" stroke="none">记录报名信息</text>
    <ellipse cx="460" cy="340" rx="100" ry="28"/><text x="460" y="345" fill="#1a4a8a" stroke="none">规划目标公司岗位</text>
    <ellipse cx="460" cy="420" rx="100" ry="28"/><text x="460" y="425" fill="#1a4a8a" stroke="none">记录准备与跟进</text>
    <ellipse cx="460" cy="500" rx="100" ry="28"/><text x="460" y="505" fill="#1a4a8a" stroke="none">搜索查看活动</text>
    <ellipse cx="700" cy="180" rx="100" ry="28"/><text x="700" y="185" fill="#1a4a8a" stroke="none">临近活动优先排序</text>
    <ellipse cx="700" cy="340" rx="100" ry="28"/><text x="700" y="345" fill="#1a4a8a" stroke="none">目标企业 / 岗位清单</text>
