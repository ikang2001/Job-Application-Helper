  <rect x="860" y="70" width="250" height="120" rx="8" fill="white" stroke="#ccc" stroke-width="1.2"/>
  <text x="985" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" font-family="Noto Sans SC, Microsoft YaHei">图例</text>
  <ellipse cx="985" cy="145" rx="75" ry="22" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="985" y="150" text-anchor="middle" font-size="12" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei">本次新增用例</text>
